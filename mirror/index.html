<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>ULTRARABBIT // MIRROR</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root { --red: #ff2d2d; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: #000; overflow: hidden; color: #fff; }
  body { font-family: "Fira Code", ui-monospace, monospace; -webkit-font-smoothing: antialiased; }
  #c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; background: #000; }
  #cam { display: none; }
  .tag {
    position: fixed; top: max(16px, env(safe-area-inset-top)); font-size: 11px; letter-spacing: .18em;
    background: #000; padding: 6px 8px; z-index: 2;
  }
  #tl { left: 16px; }
  #tr { right: 16px; text-align: right; }
  #tl b { font-weight: 600; }
  #trk { position: fixed; left: 16px; bottom: max(16px, env(safe-area-inset-bottom)); font-size: 11px; letter-spacing: .18em; background: #000; padding: 6px 8px; z-index: 2; }
  #gate {
    position: fixed; inset: 0; z-index: 10; display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: 22px; background: #000; cursor: pointer; text-align: center; padding: 16px;
    transition: opacity .5s;
  }
  #gate.gone { opacity: 0; pointer-events: none; }
  #gate img { height: min(52vh, 110vw); width: auto; display: block; }
  #gate .go { font-size: 13px; letter-spacing: .3em; color: #000; background: #fff; padding: 12px 18px; }
  #gate .note { font-size: 11px; letter-spacing: .14em; color: #aaa; max-width: 360px; line-height: 1.6; }
  #gate .err { color: var(--red); }
</style>
</head>
<body>
<video id="cam" playsinline muted></video>
<canvas id="c"></canvas>
<div id="tl" class="tag"><b>ULTRARABBIT</b> // MIRROR</div>
<div id="tr" class="tag">LOADING</div>
<div id="trk">WORKING FROM HOME</div>

<div id="gate">
  <img src="/logo.jpg" alt="ULTRARABBIT">
  <div class="go">[ TAP TO START ]</div>
  <div class="note" id="note">Uses your front camera. Nothing is recorded or uploaded; the face tracking runs on your device.</div>
</div>

<script src="/totems.js"></script>
<script type="module">
import { FaceLandmarker, FilesetResolver } from 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.21/vision_bundle.mjs';

const $ = (id) => document.getElementById(id);
const RED = '#ff2d2d', WHITE = '#ffffff', BLACK = '#000000';
const rand = (a, b) => a + Math.random() * (b - a);
const lerp = (a, b, k) => a + (b - a) * k;
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));

const canvas = $('c'), g = canvas.getContext('2d'), cam = $('cam');
let W = 0, H = 0;
function resize() {
  const dpr = Math.min(window.devicePixelRatio, 2);
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = W * dpr; canvas.height = H * dpr;
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
}
window.addEventListener('resize', resize);
resize();

/* ------------------------------------------------------------------ */
/* Face tracking                                                       */
/* ------------------------------------------------------------------ */

let landmarker = null;
const ready = (async () => {
  const files = await FilesetResolver.forVisionTasks('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.21/wasm');
  const make = (delegate) => FaceLandmarker.createFromOptions(files, {
    baseOptions: { modelAssetPath: '/models/face_landmarker.task', delegate },
    runningMode: 'VIDEO',
    numFaces: 1,
  });
  landmarker = await make('GPU').catch(() => make('CPU'));
})();

// Landmark indices (MediaPipe face mesh): eye corners, irises, forehead, cheeks, lips.
const LM = { eyeA: [33, 133], eyeB: [362, 263], irisA: 468, irisB: 473, forehead: 10, chin: 152, cheekA: 234, cheekB: 454, lipTop: 13, lipBot: 14 };

// Face frame: centre between the eyes, roll, scale (face width in px), velocity for prediction,
// and feature points in face units (x along the eye line, y down, 1 = face width).
const face = { found: false, seen: 0, cx: 0, cy: 0, roll: 0, s: 1, vx: 0, vy: 0, pts: null, lastVideo: -1 };

function videoRect() {
  const vw = cam.videoWidth || 640, vh = cam.videoHeight || 480, k = Math.max(W / vw, H / vh);
  return { dw: vw * k, dh: vh * k, ox: (W - vw * k) / 2, oy: (H - vh * k) / 2 };
}

function track(now) {
  if (!landmarker || cam.readyState < 2 || cam.currentTime === face.lastVideo) return;
  face.lastVideo = cam.currentTime;
  const res = landmarker.detectForVideo(cam, now);
  const lm = res.faceLandmarks && res.faceLandmarks[0];
  // Ride out brief tracking dropouts so the overlay doesn't flicker.
  if (!lm) { if (now - face.seen > 400) face.found = false; return; }
  const r = videoRect();
  const P = (i) => [W - (r.ox + lm[i].x * r.dw), r.oy + lm[i].y * r.dh];
  const mid = (u, v) => [(u[0] + v[0]) / 2, (u[1] + v[1]) / 2];
  let eA = mid(P(LM.eyeA[0]), P(LM.eyeA[1])), eB = mid(P(LM.eyeB[0]), P(LM.eyeB[1]));
  let iA = P(LM.irisA), iB = P(LM.irisB);
  if (eA[0] > eB[0]) { [eA, eB] = [eB, eA]; [iA, iB] = [iB, iA]; }
  const c = mid(eA, eB);
  const roll = Math.atan2(eB[1] - eA[1], eB[0] - eA[0]);
  const ca = P(LM.cheekA), cb = P(LM.cheekB);
  const sz = Math.hypot(cb[0] - ca[0], cb[1] - ca[1]);
  const local = ([x, y]) => {
    const dx = x - c[0], dy = y - c[1], co = Math.cos(-roll), si = Math.sin(-roll);
    return [(dx * co - dy * si) / sz, (dx * si + dy * co) / sz];
  };
  const pts = {
    eyeL: local(eA), eyeR: local(eB), irisL: local(iA), irisR: local(iB),
    forehead: local(P(LM.forehead)), chin: local(P(LM.chin)),
    lipTop: local(P(LM.lipTop)), lipBot: local(P(LM.lipBot)),
  };
  if (!face.found || !face.pts) {
    Object.assign(face, { cx: c[0], cy: c[1], roll, s: sz, vx: 0, vy: 0, pts });
  } else {
    // Adaptive smoothing: near-raw when the head moves (so the overlay snaps to it), heavier
    // when it's still (so it doesn't shimmer).
    const move = Math.hypot(c[0] - face.cx, c[1] - face.cy) / face.s;
    const k = clamp(.4 + move * 12, .4, 1);
    const nx = lerp(face.cx, c[0], k), ny = lerp(face.cy, c[1], k);
    face.vx = lerp(face.vx, nx - face.cx, .6); face.vy = lerp(face.vy, ny - face.cy, .6);
    face.cx = nx; face.cy = ny;
    face.roll = lerp(face.roll, roll, clamp(k + .1, 0, 1));
    face.s = lerp(face.s, sz, clamp(k, .5, 1));
    for (const key in pts) face.pts[key] = [lerp(face.pts[key][0], pts[key][0], .75), lerp(face.pts[key][1], pts[key][1], .75)];
  }
  face.found = true;
  face.seen = now;
}

/* ------------------------------------------------------------------ */
/* Audio + beat detection                                              */
/* ------------------------------------------------------------------ */

const audio = new Audio('/WorkingFromHome.mp3');
audio.loop = true;
audio.preload = 'auto';
let actx = null, analyser = null, data = null;
const A = { bass: 0, beat: false, strength: 0, kick: 0, beatCount: 0, lastBeat: -10, bpm: 0 };
const hist = [], ibis = [];

function startAudio() {
  actx = new (window.AudioContext || window.webkitAudioContext)();
  analyser = actx.createAnalyser();
  analyser.fftSize = 1024;
  analyser.smoothingTimeConstant = .55;
  data = new Uint8Array(analyser.frequencyBinCount);
  const src = actx.createMediaElementSource(audio);
  src.connect(analyser);
  src.connect(actx.destination);
  actx.resume();
  return audio.play();
}

function analyse(t, dt) {
  A.beat = false;
  if (analyser && !audio.paused) {
    analyser.getByteFrequencyData(data);
    let b = 0;
    for (let i = 1; i < 6; i++) b += data[i];
    A.bass = b / 5 / 255;
    hist.push(A.bass);
    if (hist.length > 45) hist.shift();
    const mean = hist.reduce((s, x) => s + x, 0) / hist.length;
    const sd = Math.sqrt(hist.reduce((s, x) => s + (x - mean) ** 2, 0) / hist.length);
    if (A.bass > mean + Math.max(.05, sd * 1.15) && A.bass > .25 && t - A.lastBeat > .27) {
      A.beat = true;
      A.strength = Math.min(1, Math.max(.35, (A.bass - mean) * 5));
    }
  } else if (t - A.lastBeat > .5) { A.beat = true; A.strength = .6; }
  if (A.beat) {
    const ibi = t - A.lastBeat;
    if (ibi > .27 && ibi < 1.2) { ibis.push(ibi); if (ibis.length > 24) ibis.shift(); }
    if (ibis.length > 6) { const s = [...ibis].sort((u, v) => u - v); A.bpm = Math.round(60 / s[s.length >> 1]); }
    A.lastBeat = t;
    A.beatCount++;
  }
  A.kick = Math.max(A.kick * Math.exp(-dt * 7), A.beat ? A.strength : 0);
}
const beatPhase = (t) => Math.min(1, (t - A.lastBeat) / (A.bpm ? 60 / A.bpm : .5));

/* ------------------------------------------------------------------ */
/* Totem pieces                                                        */
/* ------------------------------------------------------------------ */

// A live totem piece: spring kick, beat pop, flip, wobble and trace-on.
const piece = (k, extra = {}) => ({ ...newMod(k), wob: 0, wv: 0, ...extra });

function kickPiece(m, t, lag = 0) { m.kickAt = t + lag; m.kickStr = A.strength; }

function stepPieces(list, t, dt) {
  for (const m of list) {
    if (m.kickAt >= 0 && t >= m.kickAt) {
      m.sv += m.kickStr * 8; m.wv += (Math.random() - .5) * 9 * m.kickStr; m.pop = 1; m.kickAt = -1;
      if (Math.random() < .45) m.flip = 1;
      if (Math.random() < .25) m.inv = !m.inv;
    }
    m.sv += (-170 * m.sp - 11 * m.sv) * dt; m.sp += m.sv * dt;
    m.wv += (-120 * m.wob - 9 * m.wv) * dt; m.wob += m.wv * dt;
    m.flip *= Math.exp(-dt * 12);
    m.pop *= Math.exp(-dt * 9);
    if (m.go && m.draw < 1) m.draw = Math.min(1, m.draw + dt * 3.2);
  }
}

// Draws a piece centred at (x, y) in face units, `size` units wide.
function drawPiece(m, x, y, size, t, ph, rot = 0) {
  if (m.draw <= 0) return;
  const M = MODS[m.k], e = clamp(m.sp * 2, 0, 1), z = size * (1 + m.pop * .28 + e * .1);
  const pass = (c, a, ox) => {
    g.save();
    g.translate(x + ox, y);
    g.rotate(rot + m.wob * .35);
    g.scale(z * Math.cos(m.flip * Math.PI), z);
    g.translate(-.5, -M.h / 2);
    g.lineWidth = TOT_LW; g.lineJoin = 'miter'; g.lineCap = 'butt';
    if (m.draw < 1) g.setLineDash([m.draw * 5, 5]);
    if (m.draw < .6) g.fill = () => {};
    M.draw(g, { c, a, t, ph, e, look: Math.sin(t * 3 + x * 4), beat: A.beatCount, full: m.draw >= 1 });
    delete g.fill;
    g.restore();
  };
  if (m.draw >= 1 && e > .25) pass(RED, RED, size * e * .12);
  pass(m.inv ? RED : WHITE, m.inv ? WHITE : RED, 0);
}

const ALL_KEYS = Object.keys(MODS);

// Quiet passages still fill out: hidden pieces trace on every `every` seconds regardless of beats.
function revealOverTime(fx, list, dt, every) {
  fx.rev = (fx.rev || 0) + dt;
  if (fx.rev < every) return;
  fx.rev = 0;
  const next = list.find((m) => m.draw < 0);
  if (next) { next.go = true; next.draw = 0; }
}

/* ------------------------------------------------------------------ */
/* Totem animations around the face (each runs ~7s between rabbits)    */
/* ------------------------------------------------------------------ */

const FX = {
  // Double ring: outer ring jumps a slot per beat (reversing each bar), inner ring counter-spins.
  ORBIT: {
    init(fx) {
      fx.outer = Array.from({ length: 10 }, (_, i) => piece(totemPick(ALL_KEYS), { draw: -1, go: false, idx: i }));
      fx.inner = Array.from({ length: 6 }, () => piece(totemPick(['ARROWS', 'DIAMOND', 'EYE', 'CHEVRON']), { draw: -1, go: false }));
      fx.a = fx.at = -Math.PI / 2; fx.b = 0;
    },
    beat(fx, t) {
      const hidden = [...fx.outer, ...fx.inner].filter((m) => m.draw < 0);
      for (const m of hidden.slice(0, 2)) { m.go = true; m.draw = 0; }
      fx.at += Math.PI * 2 / 10 * (Math.floor(A.beatCount / 4) % 2 ? -1 : 1) * (A.strength > .85 ? 2 : 1);
      fx.outer.forEach((m, i) => kickPiece(m, t, i * .02));
      fx.inner.forEach((m, i) => kickPiece(m, t, .05 + i * .02));
    },
    draw(fx, t, dt, ph, k) {
      revealOverTime(fx, [...fx.outer, ...fx.inner], dt, .28);
      stepPieces([...fx.outer, ...fx.inner], t, dt);
      fx.a += (fx.at - fx.a) * Math.min(1, dt * 14);
      fx.b -= dt * (1.2 + A.kick * 4);
      const sq = 1 - k * .85;
      fx.outer.forEach((m, i) => {
        const a = fx.a + i * Math.PI * 2 / 10;
        drawPiece(m, Math.cos(a) * .9 * sq, .2 + Math.sin(a) * 1.1 * sq, .62 * (1 - k * .7), t, ph);
      });
      fx.inner.forEach((m, i) => {
        const a = fx.b + i * Math.PI * 2 / 6;
        drawPiece(m, Math.cos(a) * .55 * sq, .2 + Math.sin(a) * .7 * sq, .3 * (1 - k * .7), t, ph, a);
      });
    },
  },
  // Totem stacks either side of the face build up on the beat; a crown row tops the head.
  FLANKS: {
    init(fx) {
      fx.cols = [-1, 1].map(() => Array.from({ length: 5 }, () => piece(totemPick(ALL_KEYS), { draw: -1, go: false })));
      fx.crown = ['ARROWS', 'EARS', 'ARROWS'].map((k) => piece(k, { draw: -1, go: false }));
      fx.n = 0;
    },
    beat(fx, t) {
      fx.n++;
      for (const col of fx.cols) {
        const next = [...col].reverse().find((m) => m.draw < 0);
        if (next) { next.go = true; next.draw = 0; }
        col.forEach((m, i) => kickPiece(m, t, (col.length - i) * .03));
      }
      if (fx.n >= 3) for (const m of fx.crown) if (m.draw < 0) { m.go = true; m.draw = 0; break; }
      fx.crown.forEach((m, i) => kickPiece(m, t, i * .04));
      if (fx.n % 2 === 0) { const m = totemPick(totemPick(fx.cols)); m.k = totemPick(ALL_KEYS); m.draw = 0; }
    },
    draw(fx, t, dt, ph, k, P) {
      const all = [...fx.cols.flat(), ...fx.crown];
      revealOverTime(fx, all, dt, .4);
      stepPieces(all, t, dt);
      const gather = 1 - k * .8;
      fx.cols.forEach((col, ci) => {
        const side = ci ? 1 : -1;
        col.forEach((m, i) => drawPiece(m, side * .98 * gather, (-.95 + i * .52) * gather + .2 + Math.sin(t * 6 + i) * .015, .46 * gather, t, ph));
      });
      const fy = P ? P.forehead[1] : -.6;
      fx.crown.forEach((m, i) => drawPiece(m, (i - 1) * .5 * gather, (fy - .55) * gather, (i === 1 ? .7 : .4) * gather, t, ph));
    },
  },
  // Every beat fires a wave of pieces out of the face.
  BURST: {
    init(fx) { fx.p = []; },
    beat(fx, t) {
      const n = A.strength > .8 ? 8 : 6, off = Math.random() * Math.PI;
      for (let i = 0; i < n; i++) {
        const a = off + i * Math.PI * 2 / n;
        fx.p.push(piece(totemPick(ALL_KEYS), { born: t, a, spd: rand(1.6, 2.6), spin: rand(-6, 6), inv: Math.random() < .3 }));
      }
    },
    draw(fx, t, dt, ph, k) {
      fx.p = fx.p.filter((m) => t - m.born < 1.3);
      for (const m of fx.p) {
        const life = t - m.born, r = .25 + eOut(Math.min(1, life / 1.1)) * m.spd * (1 - k);
        drawPiece(m, Math.cos(m.a) * r, .2 + Math.sin(m.a) * r * 1.15, (.25 + life * .45) * (1 - k * .8), t, ph, life * m.spin * .3);
        m.pop *= Math.exp(-dt * 9);
      }
    },
  },
  // Pieces lock onto brow, eyes, nose and mouth and swap every beat.
  GLITCHFACE: {
    init(fx) {
      fx.slots = [
        { keys: ['CHEVRON', 'DOME', 'EARS'], w: 1.0, y: (P) => P.forehead[1] + .18 },
        { keys: ['GOGGLES', 'GOGGLES', 'EYE'], w: 1.05, y: () => 0 },
        { keys: ['ARROWS', 'DIAMOND', 'VISOR'], w: .42, y: (P) => (P.lipTop[1]) * .55 },
        { keys: ['MOUTH', 'VENT', 'VISOR'], w: .8, y: (P) => (P.lipTop[1] + P.lipBot[1]) / 2 },
      ].map((sl) => ({ ...sl, m: piece(totemPick(sl.keys), { draw: 0 }) }));
    },
    beat(fx, t) {
      const sl = totemPick(fx.slots);
      sl.m = piece(totemPick(sl.keys), { draw: 0, pop: 1, flip: 1 });
      fx.slots.forEach((s, i) => kickPiece(s.m, t, i * .03));
    },
    draw(fx, t, dt, ph, k, P) {
      if (!P) return;
      stepPieces(fx.slots.map((s) => s.m), t, dt);
      const jolt = A.kick > .7 ? (Math.random() - .5) * .06 : 0;
      fx.slots.forEach((sl, i) => drawPiece(sl.m, (i % 2 ? jolt : -jolt), sl.y(P), sl.w * (1 - k * .3), t, ph));
    },
  },
};
const FX_NAMES = Object.keys(FX);

/* ------------------------------------------------------------------ */
/* The rabbit                                                          */
/* ------------------------------------------------------------------ */

const rab = { sp: 0, sv: 0, kickAt: -1, sat: [0, 1, 2].map((i) => piece(['DIAMOND', 'ARROWS', 'DIAMOND'][i])) };

function stepRabbit(t, dt) {
  if (rab.kickAt >= 0 && t >= rab.kickAt) { rab.sv += A.strength * 8; rab.kickAt = -1; }
  rab.sv += (-170 * rab.sp - 11 * rab.sv) * dt; rab.sp += rab.sv * dt;
  stepPieces(rab.sat, t, dt);
}

// Trace-on: strokes draw along their length as d goes 0 -> 1; fills arrive late in the trace.
function traced(d, fn) {
  if (d <= 0) return;
  g.save();
  if (d < 1) g.setLineDash([d * 9, 9]);
  if (d < .65) g.fill = () => {};
  fn();
  delete g.fill;
  g.restore();
}
const line = (x1, y1, x2, y2) => { g.beginPath(); g.moveTo(x1, y1); g.lineTo(x2, y2); g.stroke(); };
const ring = (x, y, r) => { g.beginPath(); g.arc(x, y, r, 0, Math.PI * 2); g.stroke(); };
const disc = (x, y, r) => { g.beginPath(); g.arc(x, y, r, 0, Math.PI * 2); g.fill(); };
function dashed(pattern, offset, fn) { g.save(); g.setLineDash(pattern); g.lineDashOffset = offset; fn(); g.restore(); }

function drawGoggles(P, d, c, a, t, e, ph) {
  const xl = P.eyeL[0], xr = P.eyeR[0], gap = xr - xl, r = clamp(gap * .4, .12, .2);
  const x0 = xl - r - .14, x1 = xr + r + .14, y0 = -r - .07, y1 = r + .08, ch = .07;
  traced(d, () => {
    g.lineWidth = .045 + e * .02; g.strokeStyle = c;
    g.beginPath();
    [[x0 + ch, y0], [x1 - ch, y0], [x1, y0 + ch], [x1, y1 - ch], [x1 - ch, y1], [x0 + ch, y1], [x0, y1 - ch], [x0, y0 + ch]]
      .forEach(([x, y], i) => (i ? g.lineTo(x, y) : g.moveTo(x, y)));
    g.closePath(); g.stroke();
    g.lineWidth = .022;
    const chase = Math.floor(t * 10) % 3;
    for (const [sx, dir] of [[x0, 1], [x1, -1]]) {
      for (let k = 0; k < 3; k++) {
        g.strokeStyle = k === chase ? a : c;
        const x = sx + dir * (.03 + k * .025);
        line(x, y0 + ch + .02, x, y1 - ch - .02);
      }
    }
    g.strokeStyle = c; g.lineWidth = .025;
    const glitch = A.kick > .6 ? (Math.random() - .5) * .08 : 0;
    const w1 = .08 + Math.sin(t * 7) * .03, w2 = .05 + Math.cos(t * 7) * .025;
    line(-w1 + glitch, y0 + .05, w1 + glitch, y0 + .05);
    line(-w2 - glitch, y0 + .09, w2 - glitch, y0 + .09);
    line(-.06, y1 - .02, 0, y1 - .07 - e * .03); line(0, y1 - .07 - e * .03, .06, y1 - .02);
    for (const [ex, ix, iy, dir] of [[xl, P.irisL[0], P.irisL[1], 1], [xr, P.irisR[0], P.irisR[1], -1]]) {
      g.fillStyle = BLACK;
      disc(ex, 0, r);
      if (d >= 1) {
        // A scan line sweeps the lens once per beat.
        g.save();
        g.beginPath(); g.arc(ex, 0, r, 0, Math.PI * 2); g.clip();
        g.strokeStyle = a; g.lineWidth = .012;
        const sy = -r + eOut(ph) * r * 2;
        line(ex - r, sy, ex + r, sy);
        g.restore();
      }
      g.strokeStyle = a; g.lineWidth = .05 + e * .03;
      ring(ex, 0, r);
      if (d >= 1) {
        g.strokeStyle = c; g.lineWidth = .014;
        dashed([.03, .025], t * .6 * dir, () => ring(ex, 0, r + .045));
        g.lineWidth = .018;
        for (let i = 0; i < 6; i++) {
          const an = t * 1.8 * dir + i * Math.PI / 3;
          line(ex + Math.cos(an) * (r + .075), Math.sin(an) * (r + .075), ex + Math.cos(an) * (r + .1), Math.sin(an) * (r + .1));
        }
      }
      g.fillStyle = c;
      const px = ex + clamp((ix - ex) * 2.2, -r * .55, r * .55), py = clamp(iy * 2.2, -r * .55, r * .55);
      disc(px, py, r * .3 * (1 + e * .6));
    }
  });
}

const EAR_PTS = [[.1, .9], [.1, .06], [.45, .4], [.45, .9]];
function drawEars(P, d, c, a, t, e, ph) {
  const fy = P.forehead[1], size = 1.2;
  traced(d, () => {
    g.lineWidth = .05; g.strokeStyle = c;
    g.beginPath(); g.arc(0, fy + .5, .5, Math.PI + .55, -.55); g.stroke();
    if (d >= 1) { g.lineWidth = .016; dashed([.04, .03], -t * .5, () => { g.beginPath(); g.arc(0, fy + .5, .58, Math.PI + .5, -.5); g.stroke(); }); }
    for (const side of [-1, 1]) {
      g.save();
      g.scale(side, 1);
      g.translate(-size / 2, fy - size * .83);
      g.scale(size, size);
      g.translate(.27, .9); g.rotate(-(e * .32 + Math.sin(t * 3.4) * .04)); g.translate(-.27, -.9);
      g.lineWidth = .05 / size; g.strokeStyle = c;
      g.beginPath(); EAR_PTS.forEach(([x, y], i) => (i ? g.lineTo(x, y) : g.moveTo(x, y))); g.closePath(); g.stroke();
      if (d >= 1) {
        // Inner echo breathing in the ear, with hatching scrolling up it.
        const k = .55 + Math.sin(t * 5) * .06 + e * .15;
        g.save();
        g.translate(.27, .55); g.scale(k, k); g.translate(-.27, -.55);
        g.lineWidth = .025 / size; g.strokeStyle = e > .3 ? a : c;
        g.beginPath(); EAR_PTS.forEach(([x, y], i) => (i ? g.lineTo(x, y) : g.moveTo(x, y))); g.closePath(); g.stroke();
        g.clip();
        g.lineWidth = .012 / size;
        const off = (t * .4) % .1;
        for (let y = .95 - off; y > 0; y -= .1) line(0, y, .6, y - .25);
        g.restore();
      }
      g.restore();
    }
    for (let k = 0; k < 3; k++) {
      const y = fy - .42 + k * .1 + .1 - eOut(ph) * .1;
      g.fillStyle = (k + A.beatCount) % 3 === 0 ? a : c;
      g.beginPath(); g.moveTo(0, y); g.lineTo(-.07, y + .075); g.lineTo(.07, y + .075); g.closePath(); g.fill();
    }
  });
}

function drawMouth(P, d, c, a, t, e) {
  const mx = (P.lipTop[0] + P.lipBot[0]) / 2, my = (P.lipTop[1] + P.lipBot[1]) / 2;
  const open = clamp((P.lipBot[1] - P.lipTop[1]) * 1.6, 0, .25) + e * .06, R = .32, hr = .2;
  traced(d, () => {
    g.strokeStyle = c; g.lineWidth = .03;
    ring(mx, my, R);
    if (d >= 1) { g.lineWidth = .014; dashed([.05, .035], t * .7, () => ring(mx, my, R + .05)); }
    g.fillStyle = c;
    g.beginPath(); g.arc(mx, my - .1 - open / 2, hr, Math.PI, 0); g.closePath(); g.fill();
    g.beginPath(); g.arc(mx, my + .1 + open / 2, hr, 0, Math.PI); g.closePath(); g.fill();
    // ULTRARABBIT wordmark, fitted to run past the ring like the logo; inverts on alternate beats.
    const flip = d >= 1 && A.beatCount % 2 === 1;
    g.save();
    g.translate(mx, my);
    g.font = '900 100px "Arial Black", "Helvetica Neue", Helvetica, Arial, sans-serif';
    const k = 1.15 / g.measureText('ULTRARABBIT').width;
    const bh = 100 * k * .95, bw = 1.25;
    g.fillStyle = flip ? c : BLACK;
    g.fillRect(-bw / 2, -bh / 2, bw, bh);
    if (d >= .65) {
      g.scale(k, k);
      g.fillStyle = flip ? BLACK : c;
      g.textAlign = 'center'; g.textBaseline = 'middle';
      g.fillText('ULTRARABBIT', 0, 4);
    }
    g.restore();
  });
}

function drawRabbit(P, d, t, ph, red = false) {
  const e = clamp(rab.sp * 2, 0, 1);
  const inv = red || A.beatCount % 16 === 0;
  const c = inv ? RED : WHITE, a = inv ? WHITE : RED;
  drawEars(P, d.ears, c, a, t, e, ph);
  drawGoggles(P, d.goggles, c, a, t, e, ph);
  drawMouth(P, d.mouth, c, a, t, e);
  if (d.mouth >= 1 && !red) {
    // Satellites orbiting the head.
    rab.sat.forEach((m, i) => {
      const an = t * (1.6 + i * .3) * (i % 2 ? -1 : 1) + i * 2.1;
      drawPiece(m, Math.cos(an) * .82, .1 + Math.sin(an) * 1.05, .2, t, ph);
    });
  }
}

/* ------------------------------------------------------------------ */
/* Sequence: intro totems -> rabbit (10s) -> random totem fx -> rabbit… */
/* ------------------------------------------------------------------ */

const TIMES = { intro: 12, converge: 2.2, trace: 2.2, rabbit: 10, untrace: .6, fx: 7 };
const seq = { name: 'intro', start: 0, fx: null, fxName: 'ORBIT' };

function enter(name, t) {
  seq.name = name; seq.start = t;
  if (name === 'intro' || name === 'fx') {
    seq.fxName = name === 'intro' ? 'ORBIT' : totemPick(FX_NAMES.filter((n) => n !== seq.fxName));
    seq.fx = {};
    FX[seq.fxName].init(seq.fx);
  }
}

function advance(t) {
  const el = t - seq.start;
  if (seq.name === 'intro' && el > TIMES.intro) enter('converge', t);
  else if (seq.name === 'converge' && el > TIMES.converge) enter('trace', t);
  else if (seq.name === 'trace' && el > TIMES.trace) enter('rabbit', t);
  else if (seq.name === 'rabbit' && el > TIMES.rabbit) enter('untrace', t);
  else if (seq.name === 'untrace' && el > TIMES.untrace) enter('fx', t);
  else if (seq.name === 'fx' && el > TIMES.fx) enter('converge', t);
}

function rabbitProgress(t) {
  const el = t - seq.start, p = (start, dur = 1) => clamp((el - start) / dur, 0, 1);
  if (seq.name === 'trace') return { goggles: p(0), ears: p(.5), mouth: p(1) };
  if (seq.name === 'rabbit') return { goggles: 1, ears: 1, mouth: 1 };
  if (seq.name === 'untrace') { const u = 1 - el / TIMES.untrace; return { goggles: u, ears: u, mouth: u }; }
  return null;
}

/* ------------------------------------------------------------------ */
/* Loop                                                                */
/* ------------------------------------------------------------------ */

// `t` drives physics with a clamped step; `clock` is real time so the sequence keeps to the
// wall clock even when frames drop.
let t = 0, clock = 0, last = performance.now(), running = false;

function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min((now - last) / 1000, .05);
  last = now;
  t += dt;
  clock = now / 1000;
  if (!running) return;

  track(now);
  analyse(t, dt);
  advance(clock);
  const ph = beatPhase(t);
  if (A.beat) {
    if (seq.fx) FX[seq.fxName].beat(seq.fx, t);
    rab.kickAt = t;
    rab.sat.forEach((m, i) => kickPiece(m, t, i * .04));
  }
  stepRabbit(t, dt);

  g.setTransform(canvas.width / W, 0, 0, canvas.height / H, 0, 0);
  g.fillStyle = BLACK;
  g.fillRect(0, 0, W, H);
  if (cam.readyState >= 2) {
    const r = videoRect();
    g.save();
    g.translate(W, 0); g.scale(-1, 1);
    g.drawImage(cam, r.ox, r.oy, r.dw, r.dh);
    g.restore();
    // Black and white, knocked back so the white line-work pops (blend modes work in every browser).
    g.globalCompositeOperation = 'saturation';
    g.fillStyle = BLACK; g.fillRect(0, 0, W, H);
    g.globalCompositeOperation = 'multiply';
    g.fillStyle = '#b4b4b4'; g.fillRect(0, 0, W, H);
    g.globalCompositeOperation = 'source-over';
  }

  const found = face.found && face.pts;
  const P = found ? face.pts : null;
  const s = found ? face.s : Math.min(W, H) * .4;
  g.save();
  // Lead the head slightly by its velocity so the overlay doesn't trail behind fast moves.
  if (found) { g.translate(face.cx + face.vx * .8, face.cy + face.vy * .8); g.rotate(face.roll); } else g.translate(W / 2, H * .42);
  // Hard kicks jolt the whole overlay sideways for a frame.
  if (A.kick > .75 && Math.random() < .5) g.translate((Math.random() - .5) * s * .05, 0);
  g.scale(s, s);
  g.lineJoin = 'miter'; g.lineCap = 'butt';

  const el = clock - seq.start;
  if (seq.fx && (seq.name === 'intro' || seq.name === 'fx' || seq.name === 'converge')) {
    const k = seq.name === 'converge' ? eOut(clamp(el / TIMES.converge, 0, 1)) : 0;
    if (k < .98) FX[seq.fxName].draw(seq.fx, t, dt, ph, k, P);
    if (seq.name === 'converge' && el > TIMES.converge * .95) seq.fx = null;
  }
  const d = rabbitProgress(clock);
  if (found && d) {
    const e = clamp(rab.sp * 2, 0, 1);
    if (e > .3 && seq.name === 'rabbit') {
      g.save(); g.translate(e * .06, 0); drawRabbit(P, d, t, ph, true); g.restore();
    }
    drawRabbit(P, d, t, ph);
  }
  g.restore();

  $('tr').textContent = !landmarker ? 'LOADING' : found ? (A.bpm ? `BPM ~${A.bpm}` : 'LOCKED') : 'SHOW YOUR FACE';
}
requestAnimationFrame(frame);

$('gate').addEventListener('click', async () => {
  $('note').textContent = 'Starting…';
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user', width: { ideal: 1280 }, height: { ideal: 720 } }, audio: false });
    cam.srcObject = stream;
    await cam.play();
  } catch (e) {
    $('note').textContent = 'Camera blocked. Allow camera access for this site and tap again.';
    $('note').classList.add('err');
    return;
  }
  startAudio().catch(() => {});
  $('gate').classList.add('gone');
  enter('intro', performance.now() / 1000);
  running = true;
  await ready;
});
</script>
</body>
</html>
