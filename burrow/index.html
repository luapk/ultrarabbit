  null,
  null,
];

// Beat grids for tracks that have one: sync-mode taps snap to the bar, then shift by the line's
// pickup, so tapping only has to be within half a bar to come out exact.
const TRACK_GRID = [
  { bpm: 146.728, phase: .0204, pickup: (text) => (text === 'THIS IS WHAT WE DO' ? 0 : -1.5) },
  null,
  null,
];

const HEX = { red: '#ff2d2d', black: '#000000', white: '#ffffff' };
const $ = (id) => document.getElementById(id);
const stage = $('stage'), front = $('front'), flashEl = $('flash'), grain = $('grain');
const rand = (a, b) => a + Math.random() * (b - a);
const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];

/* ------------------------------------------------------------------ */
/* Low-poly rabbit mask geometry                                       */
/* ------------------------------------------------------------------ */

function hash3(x, y, z) {
  const s = Math.sin(x * 127.1 + y * 311.7 + z * 74.7) * 43758.5453;
  return s - Math.floor(s);
}

// Keyed on rounded position so seam-duplicated vertices move together and the shell stays closed.
function jitter(geo, amt) {
  const p = geo.attributes.position;
  for (let i = 0; i < p.count; i++) {
    const x = p.getX(i), y = p.getY(i), z = p.getZ(i);
    const kx = Math.round(x * 1000) / 1000, ky = Math.round(y * 1000) / 1000, kz = Math.round(z * 1000) / 1000;
    p.setXYZ(i,
      x + (hash3(kx, ky, kz) - .5) * amt,
      y + (hash3(ky, kz, kx) - .5) * amt,
      z + (hash3(kz, kx, ky) - .5) * amt);
  }
}

const flat = (g) => (g.index ? g.toNonIndexed() : g);

function removeTris(geo, test) {
  const a = geo.attributes.position.array, out = [];
  for (let i = 0; i < a.length; i += 9) {
    const cx = (a[i] + a[i + 3] + a[i + 6]) / 3, cy = (a[i + 1] + a[i + 4] + a[i + 7]) / 3, cz = (a[i + 2] + a[i + 5] + a[i + 8]) / 3;
    if (!test(cx, cy, cz)) for (let k = 0; k < 9; k++) out.push(a[i + k]);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(out, 3));
  return g;
}

const MASK = { w: 1, h: 1, faceY: 0 };
function buildMask() {
  const parts = [];

  // Long carved face: domed brow with a hard ledge, pinhole eyes, straight nose ridge, small open mouth.
  let face = new THREE.SphereGeometry(1, 12, 15, 0, Math.PI, Math.PI * .03, Math.PI * .93);
  face.scale(.8, 1.6, .6);
  const fp = face.attributes.position;
  for (let i = 0; i < fp.count; i++) {
    let x = fp.getX(i), y = fp.getY(i), z = fp.getZ(i);
    x *= 1 - .3 * Math.min(1, Math.max(0, -y / 1.6));
    const front = z > .05 ? 1 : 0;
    if (y > .45) z += .26 * front * (1 - Math.min(1, ((y - .45) / 1.2) ** 2));
    if (y > -.05 && y <= .45 && Math.abs(x) > .1) z -= .1 * front;
    if (Math.abs(x) < .13 && y > -.95 && y < .45) z += .22 * front * (1 - Math.abs(x) / .13);
    if (Math.abs(x) < .34 && y > -1.45 && y < -.95) z += .15 * front * (1 - Math.abs(x) / .34);
    fp.setXYZ(i, x, y, z);
  }
  jitter(face, .035);
  face = flat(face);
  parts.push([face, 0]);

  // Features sit on the carved surface: find it by casting rays at the shell.
  const probe = new THREE.Mesh(face, new THREE.MeshBasicMaterial({ side: THREE.DoubleSide }));
  const ray = new THREE.Raycaster();
  const surfZ = (x, y) => {
    ray.set(new THREE.Vector3(x, y, 5), new THREE.Vector3(0, 0, -1));
    const hit = ray.intersectObject(probe)[0];
    return hit ? hit.point.z : .5;
  };
  for (const s of [-1, 1]) {
    const eye = new THREE.OctahedronGeometry(.065, 0);
    eye.scale(1, 1, .4); eye.translate(s * .22, .22, surfZ(s * .22, .22) + .01);
    parts.push([flat(eye), 1]);
  }
  const mouth = new THREE.BoxGeometry(.3, .1, .05);
  mouth.translate(0, -1.2, surfZ(0, -1.2) + .005);
  parts.push([flat(mouth), 3]);

  const tab = new THREE.CylinderGeometry(.07, .09, .32, 5);
  tab.translate(0, -1.68, .22);
  parts.push([flat(tab), 0]);

  // Tall, straight, pointed ears, widest a third of the way up.
  for (const s of [-1, 1]) {
    const ear = new THREE.CylinderGeometry(1, 1, 1, 6, 4);
    const ep = ear.attributes.position;
    for (let i = 0; i < ep.count; i++) {
      const h = ep.getY(i) + .5;
      const r = h < .32 ? .72 + h * .9 : Math.max(0, 1 - (h - .32) / .68) ** .8;
      ep.setXYZ(i, ep.getX(i) * r * .2, h * 2.5, ep.getZ(i) * r * .09);
    }
    ear.rotateX(-.06);
    ear.rotateZ(-s * .13);
    ear.translate(s * .3, .95, -.06);
    jitter(ear, .03);
    parts.push([flat(ear), 0]);
  }

  let total = 0;
  parts.forEach(([g]) => (total += g.attributes.position.count));
  const pos = new Float32Array(total * 3), cen = new Float32Array(total * 3), rnd = new Float32Array(total * 3);
  const bar = new Float32Array(total * 3), acc = new Float32Array(total);
  const BARY = [[1, 0, 0], [0, 1, 0], [0, 0, 1]];
  let v = 0;
  for (const [g, accent] of parts) {
    const a = g.attributes.position.array;
    for (let i = 0; i < a.length; i += 9) {
      const c = [(a[i] + a[i + 3] + a[i + 6]) / 3, (a[i + 1] + a[i + 4] + a[i + 7]) / 3, (a[i + 2] + a[i + 5] + a[i + 8]) / 3];
      const r = [Math.random(), Math.random(), Math.random()];
      for (let k = 0; k < 3; k++, v++) {
        pos.set([a[i + k * 3], a[i + k * 3 + 1], a[i + k * 3 + 2]], v * 3);
        cen.set(c, v * 3); rnd.set(r, v * 3); bar.set(BARY[k], v * 3); acc[v] = accent;
      }
    }
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  geo.setAttribute('aCentroid', new THREE.BufferAttribute(cen, 3));
  geo.setAttribute('aRand', new THREE.BufferAttribute(rnd, 3));
  geo.setAttribute('aBary', new THREE.BufferAttribute(bar, 3));
  geo.setAttribute('aAccent', new THREE.BufferAttribute(acc, 1));
  geo.computeVertexNormals();
  geo.computeBoundingBox();
  const bb = geo.boundingBox, c = bb.getCenter(new THREE.Vector3());
  geo.translate(-c.x, -c.y, 0);
  const cen2 = geo.attributes.aCentroid;
  for (let i = 0; i < cen2.count; i++) cen2.setXYZ(i, cen2.getX(i) - c.x, cen2.getY(i) - c.y, cen2.getZ(i));
  MASK.w = bb.max.x - bb.min.x; MASK.h = bb.max.y - bb.min.y; MASK.faceY = -c.y;
  return geo;
}

/* 3-band toon shader: every facet resolves to exactly one of the palette colours. */
const VERT = `
attribute vec3 aCentroid; attribute vec3 aRand; attribute vec3 aBary; attribute float aAccent;
uniform float uExplode, uTime, uGlitch;
varying vec3 vN; varying vec3 vBary; varying float vAccent; varying float vDepth;
mat3 rotAxis(vec3 ax, float a) {
  ax = normalize(ax); float s = sin(a), c = cos(a), oc = 1. - c;
  return mat3(oc*ax.x*ax.x + c, oc*ax.x*ax.y + ax.z*s, oc*ax.z*ax.x - ax.y*s,
              oc*ax.x*ax.y - ax.z*s, oc*ax.y*ax.y + c, oc*ax.y*ax.z + ax.x*s,
              oc*ax.z*ax.x + ax.y*s, oc*ax.y*ax.z - ax.x*s, oc*ax.z*ax.z + c);
}
void main() {
  float e = uExplode * (.5 + aRand.x);
  mat3 R = rotAxis(aRand * 2. - 1. + vec3(.001), e * 4.);
  vec3 dir = normalize(aCentroid * vec3(1., 1., 1.6) + (aRand - .5) * .8 + vec3(0., 0., .001));
  vec3 p = aCentroid + R * (position - aCentroid) * max(0., 1. - e * .25) + dir * e * 1.6;
  if (uGlitch > 0.) {
    float sl = floor((p.y + uTime * 3.) * 6.);
    float r = fract(sin(sl * 127.1 + floor(uTime * 24.) * 7.) * 43758.5);
    p.x += uGlitch * (r - .5) * step(.55, r) * 1.4;
  }
  vN = normalize(normalMatrix * (R * normal));
  vBary = aBary; vAccent = aAccent;
  vec4 mv = modelViewMatrix * vec4(p, 1.);
  vDepth = -mv.z;
  gl_Position = projectionMatrix * mv;
}`;

const FRAG = `
uniform vec3 cDark, cMid, cLight, cAccent, cEdge, cFade, cVoid, uLight;
uniform float uEdge, uFlash, uFadeNear, uFadeFar, uT1, uT2;
varying vec3 vN; varying vec3 vBary; varying float vAccent; varying float vDepth;
void main() {
  vec3 n = normalize(vN);
  if (!gl_FrontFacing) n = -n;
  float l = dot(n, normalize(uLight)) * .5 + .5 + uFlash;
  vec3 c = l < uT1 ? cDark : (l < uT2 ? cMid : cLight);
  if (vAccent > 2.5) c = cVoid; else if (vAccent > 1.5) c = cLight; else if (vAccent > .5) c = cAccent;
  float m = min(min(vBary.x, vBary.y), vBary.z);
  float edge = 1. - smoothstep(0., fwidth(m) * 1.3, m);
  c = mix(c, cEdge, edge * uEdge);
  c = mix(c, cFade, smoothstep(uFadeNear, uFadeFar, vDepth));
  gl_FragColor = vec4(c, 1.);
}`;

/* Three.js setup                                                      */

const canvas = $('gl');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setClearColor(0x000000, 0);
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(35, 1, .1, 200);
const camBase = { pos: new THREE.Vector3(0, 0, 6), look: new THREE.Vector3() };

const baseMat = new THREE.ShaderMaterial({
  uniforms: {
    uExplode: { value: 0 }, uTime: { value: 0 }, uGlitch: { value: 0 },
    cDark: { value: new THREE.Color() }, cMid: { value: new THREE.Color() }, cLight: { value: new THREE.Color() },
    cAccent: { value: new THREE.Color() }, cEdge: { value: new THREE.Color() }, cFade: { value: new THREE.Color() },
    cVoid: { value: new THREE.Color() },
    uLight: { value: new THREE.Vector3(.4, .7, .6) },
    uEdge: { value: 1 }, uFlash: { value: 0 }, uFadeNear: { value: 900 }, uFadeFar: { value: 1000 },
    uT1: { value: .5 }, uT2: { value: .8 },
  },
  vertexShader: VERT, fragmentShader: FRAG, side: THREE.DoubleSide, extensions: { derivatives: true },
});

const maskGeo = buildMask();
const masks = [];
for (let i = 0; i < 40; i++) {
  const m = new THREE.Mesh(maskGeo, baseMat.clone());
  m.frustumCulled = false;
  m.visible = false;
  m.userData = { phase: Math.random() * Math.PI * 2, nod: 0 };
  scene.add(m);
  masks.push(m);
}

function palette(m, dark, mid, light, accent, edge) {
  const u = m.material.uniforms;
  u.cDark.value.set(HEX[dark]); u.cMid.value.set(HEX[mid]); u.cLight.value.set(HEX[light]);
  u.cAccent.value.set(HEX[accent]); u.cEdge.value.set(HEX[edge]);
}

function resetMasks() {
  for (const m of masks) {
    m.visible = false;
    m.position.set(0, 0, 0); m.rotation.set(0, 0, 0); m.scale.setScalar(1);
    const u = m.material.uniforms;
    u.uExplode.value = 0; u.uGlitch.value = 0; u.uFlash.value = 0; u.uEdge.value = 0;
    u.uFadeNear.value = 900; u.uFadeFar.value = 1000;
  }
}

function setCam(fov, pos, look = [0, 0, 0]) {
  camera.fov = fov;
  camBase.pos.set(...pos); camBase.look.set(...look);
  camera.position.copy(camBase.pos); camera.lookAt(camBase.look);
  camera.updateProjectionMatrix();
}

let bgName = 'black';
function setBg(name) {
  bgName = name;
  stage.style.background = HEX[name];
}

const view = () => ({ W: window.innerWidth, H: window.innerHeight, aspect: window.innerWidth / window.innerHeight });
const visH = (dist) => 2 * dist * Math.tan(THREE.MathUtils.degToRad(camera.fov / 2));

/* ------------------------------------------------------------------ */
/* Audio + beat detection                                              */
/* ------------------------------------------------------------------ */

const audio = new Audio();
audio.preload = 'auto';
let actx = null, analyser = null, data = null, micSrc = null, micStream = null;
let mode = 'idle', cur = 0;

const A = { bass: 0, mid: 0, high: 0, level: 0, beat: false, strength: 0, kick: 0, beatCount: 0, lastBeat: -10, bpm: 0 };
const hist = [], ibis = [];

function ensureCtx() {
  if (actx) return;
  actx = new (window.AudioContext || window.webkitAudioContext)();
  analyser = actx.createAnalyser();
  analyser.fftSize = 1024;
  analyser.smoothingTimeConstant = .55;
  data = new Uint8Array(analyser.frequencyBinCount);
  const el = actx.createMediaElementSource(audio);
  el.connect(analyser);
  el.connect(actx.destination);
}

function band(a, b) {
  let s = 0;
  for (let i = a; i < b; i++) s += data[i];
  return s / (b - a) / 255;
}

function analyse(t, dt) {
  A.beat = false;
  const live = analyser && ((mode === 'track' && !audio.paused) || mode === 'mic');
  if (live) {
    analyser.getByteFrequencyData(data);
    A.bass = band(1, 6); A.mid = band(6, 48); A.high = band(48, 220); A.level = band(0, 256);
    hist.push(A.bass);
    if (hist.length > 45) hist.shift();
    const mean = hist.reduce((s, x) => s + x, 0) / hist.length;
    const sd = Math.sqrt(hist.reduce((s, x) => s + (x - mean) ** 2, 0) / hist.length);
    if (A.bass > mean + Math.max(.05, sd * 1.15) && A.bass > .25 && t - A.lastBeat > .27) {
      A.beat = true;
      A.strength = Math.min(1, Math.max(.35, (A.bass - mean) * 5));
    }
  } else {
    // Attract mode: a steady 120 BPM pulse so the page is alive before audio starts.
    if (t - A.lastBeat > .5) { A.beat = true; A.strength = .7; }
    A.bass = Math.exp(-(t - A.lastBeat) * 6) * .7;
    A.mid = .3 + Math.sin(t * 1.3) * .1; A.high = .2; A.level = .3;
  }
  if (A.beat) {
    const ibi = t - A.lastBeat;
    if (ibi > .27 && ibi < 1.2) { ibis.push(ibi); if (ibis.length > 24) ibis.shift(); }
    if (ibis.length > 6) {
      const s = [...ibis].sort((a, b) => a - b);
      A.bpm = Math.round(60 / s[s.length >> 1]);
    }
    A.lastBeat = t;
    A.beatCount++;
  }
  A.kick = Math.max(A.kick * Math.exp(-dt * 7), A.beat ? A.strength : 0);
}

// Smooth music clock in beats. With a measured grid it comes straight from the playback
// position; otherwise it runs at the detected tempo and eases toward each detected beat, so
// anything driven by it moves fluidly instead of waiting on the next beat.
const MC = { v: 0, corr: 0 };
function stepMusicClock(dt) {
  const grid = mode === 'track' ? TRACK_GRID[cur] : null;
  if (grid && !audio.paused) { MC.v = (audio.currentTime - grid.phase) * grid.bpm / 60; return; }
  MC.v += dt * (A.bpm || 120) / 60 * (1 + MC.corr);
  MC.corr *= Math.exp(-dt * 1.5);
  if (A.beat) MC.corr = Math.max(-.25, Math.min(.25, (Math.round(MC.v) - MC.v) * .6));
}

function playTrack(i) {
  stopMic();
  cur = (i + TRACKS.length) % TRACKS.length;
  bandPlays = 0;
  audio.src = TRACKS[cur].src;
  audio.play().catch(() => {});
  mode = 'track';
  updateHud();
  syncRender();
}

function togglePlay() {
  if (mode !== 'track') return playTrack(cur);
  if (audio.paused) audio.play().catch(() => {}); else audio.pause();
  updateHud();
}

async function startMic() {
  ensureCtx();
  await actx.resume();
  try {
    micStream = await navigator.mediaDevices.getUserMedia({
      audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false },
    });
  } catch (e) {
    $('src').textContent = 'MIC BLOCKED';
    return;
  }
  audio.pause();
  micSrc = actx.createMediaStreamSource(micStream);
  micSrc.connect(analyser);
  mode = 'mic';
  updateHud();
}

function stopMic() {
  if (!micStream) return;
  micSrc.disconnect();
  micStream.getTracks().forEach((tr) => tr.stop());
  micStream = micSrc = null;
  if (mode === 'mic') mode = 'idle';
  updateHud();
}

audio.addEventListener('ended', () => playTrack(cur + 1));
audio.addEventListener('play', updateHud);
audio.addEventListener('pause', updateHud);

/* ------------------------------------------------------------------ */
/* Giant lyric typography                                              */
/* ------------------------------------------------------------------ */

const T = { mode: 'slam', phrase: '', words: [], wi: 0, active: 0, full: false, beats: 0, punch: 0, rot: 0, sync: -1, pal: '', els: [] };

// v2: v1 taps predate the beat-grid timings and would override them.
const SYNC_KEY = 'burrow-sync-v2';
let localSync = {};
try { localSync = JSON.parse(localStorage.getItem(SYNC_KEY)) || {}; } catch (e) { localSync = {}; }
const timingsFor = (i) => (localSync[i] && localSync[i].length ? localSync[i] : BAKED_SYNC[i]);

function saveLocalSync() {
  try { localStorage.setItem(SYNC_KEY, JSON.stringify(localSync)); } catch (e) { /* private mode: timings live for this visit only */ }
}

// The line being sung right now. Lyrics only ever come from timings: no timings, no text.
function currentLine() {
  if (mode !== 'track') return null;
  const times = timingsFor(cur);
  if (!times || !times.length) return null;
  const ct = audio.currentTime;
  let i = -1;
  for (let k = 0; k < times.length && times[k] <= ct; k++) i = k;
  if (i < 0) return null;
  const text = SONG_LINES[cur][i], words = text.split(' ');
  const ends = STANZA_ENDS[cur];
  const first = i === 0 || ends.includes(i - 1);
  if (!first && !ends.includes(i) && !REFRAIN.has(text) && !HIGHLIGHT.has(text)) return null;
  const next = i + 1 < times.length ? times[i + 1] : Infinity;
  const paced = Math.min(next, times[i] + 1.6 + words.length * .55);
  const last = STANZA_ENDS[cur].includes(i);
  if (!last && ct >= paced) return null;
  return { i, start: times[i], paced, last, text, words };
}

function syncText() {
  const L = currentLine();
  if (!L) {
    if (T.sync >= 0) { T.sync = -1; T.phrase = ''; renderText(); }
    return;
  }
  const ct = audio.currentTime;
  const wi = Math.min(L.words.length - 1, Math.floor((ct - L.start) / (L.paced - L.start) * L.words.length));
  const full = L.last && ct >= L.paced;
  if (L.i !== T.sync) {
    T.sync = L.i;
    T.phrase = L.text; T.words = L.words; T.wi = T.active = wi; T.full = full;
    renderText();
    T.punch = 1; T.rot = rand(-3, 3);
  } else if (T.mode === 'slam' && (wi !== T.wi || full !== T.full)) {
    T.wi = T.active = wi; T.full = full;
    renderText();
    T.punch = 1; T.rot = full ? 0 : rand(-3, 3);
  } else if (!full && wi !== T.wi) {
    // The highlighter follows the vocal through the line.
    T.wi = T.active = wi;
    markActive();
  } else T.full = full;
}

function wrapLines(words, max) {
  const out = [];
  let line = [];
  for (const w of words) {
    if (line.length && [...line, w].join(' ').length > max) { out.push(line); line = [w]; } else line.push(w);
  }
  if (line.length) out.push(line);
  return out;
}

function fitSpan(span, maxW, maxH) {
  span.style.fontSize = '100px';
  const w = span.getBoundingClientRect().width || 1;
  const fs = Math.min(100 * maxW / w, maxH / .95);
  span.style.fontSize = fs + 'px';
  return fs;
}

// Word blocks take the two palette colours that differ from the scene background; the
// highlighter uses the contrasting pair.
const WORD_PAL = {
  black: { wb: HEX.white, wt: HEX.black, ab: HEX.red, at: HEX.white },
  red: { wb: HEX.black, wt: HEX.white, ab: HEX.white, at: HEX.red },
  white: { wb: HEX.black, wt: HEX.white, ab: HEX.red, at: HEX.white },
};
function applyWordPalette() {
  if (T.pal === bgName) return;
  T.pal = bgName;
  const p = WORD_PAL[bgName];
  for (const k in p) front.style.setProperty('--' + k, p[k]);
}

function markActive() {
  T.els.forEach((el, i) => el.classList.toggle('on', T.els.length === 1 || i === T.active));
}

function renderText() {
  const { W, H } = view();
  front.replaceChildren();
  front.style.transform = '';
  T.els = [];
  if (T.mode === 'none' || !T.phrase) return;
  applyWordPalette();
  const words = T.mode === 'slam' && !T.full ? [T.words[T.wi]] : T.words;
  const lines = wrapLines(words, W / H > 1 ? 13 : 9).map((ws) => {
    const ln = document.createElement('span');
    ln.className = 'ln';
    for (const w of ws) {
      const el = document.createElement('span');
      el.className = 'w';
      el.textContent = w;
      ln.append(el);
      T.els.push(el);
    }
    return ln;
  });
  front.append(...lines);
  const single = words.length === 1;
  const sizes = lines.map((ln) => fitSpan(ln, W * .9, single ? H * .7 : H));
  const total = sizes.reduce((a, b) => a + b * .95, 0);
  if (total > H * .88) lines.forEach((ln, i) => (ln.style.fontSize = sizes[i] * H * .88 / total + 'px'));
  markActive();
}

function textSetup(textMode) {
  front.replaceChildren();
  T.mode = textMode;
  T.beats = 0;
  T.sync = -1;
  T.phrase = '';
  T.els = [];
}

// While a held last line sits on screen, the highlighter steps through it on the beat.
function textBeat() {
  T.beats++;
  if (T.sync < 0) return;
  if (T.full && T.els.length > 1) { T.active = (T.active + 1) % T.els.length; markActive(); }
  T.punch = Math.max(T.punch, .45);
}

function textUpdate(dt) {
  T.punch *= Math.exp(-dt * 12);
  if (T.els.length) applyWordPalette();
  const shake = A.kick > .65 ? rand(-1, 1) * A.kick * 14 : 0;
  front.style.transform = `translateX(${shake}px) scale(${1 + T.punch * .1}) rotate(${T.rot * T.punch}deg)`;
}



/* Techno totems: glyph library lives in /totems.js                   */
/* ------------------------------------------------------------------ */


const TOT = { look: 0, lookT: 0 };
const beatPhase = () => Math.min(1, (t - A.lastBeat) / (A.bpm ? 60 / A.bpm : .5));

// Hide modules until a beat (or a delay) traces them on.
function hideTotem(tt, delay = -1) {
  tt.forEach((m, i) => { m.draw = delay < 0 ? -1 : -(delay + i * .12) * 2.4; m.go = delay >= 0; });
}

// A kick ripples down the totem: each module's spring fires a little after the one above.
function kickTotem(tt, str, lag = 0) {
  tt.forEach((m, i) => { m.kickAt = t + lag + i * .028; m.kickStr = str; });
}

function hitTotem(tt) {
  const m = pick(tt), r = Math.random();
  if (r < .35) m.flip = 1;
  else if (r < .6) m.inv = !m.inv;
  else { m.k = pick(MOD_SWAP[m.k]); m.draw = 0; m.go = true; m.pop = 1; }
}

function stepTotems(list, dt) {
  for (const tt of list) for (const m of tt) {
    if (m.kickAt >= 0 && t >= m.kickAt) { m.sv += m.kickStr * 5.5; m.kickAt = -1; }
    m.sv += (-150 * m.sp - 12 * m.sv) * dt;
    m.sp += m.sv * dt;
    m.flip *= Math.exp(-dt * 14);
    m.pop *= Math.exp(-dt * 10);
    if (m.go && m.draw < 1) m.draw = Math.min(1, m.draw + dt * 2.4);
  }
}

// Draws a totem with its top-left at (x, y), `s` pixels per unit. `scan` (0..1) sweeps a red
// line down the totem that inverts whatever module it crosses.
function drawTotem(g, tt, x, y, s, opts = {}) {
  const { scan = -1 } = opts;
  const ph = beatPhase(), H = totemH(tt), mid = y + H * s / 2, cx = x + s / 2;
  let yy = y;
  const placed = tt.map((m) => {
    const M = MODS[m.k], top = yy;
    yy += (M.h + TOT_GAP) * s;
    const yc = top + M.h * s / 2;
    return { m, M, top, dy: -m.sp * (yc - mid) * .1 };
  });
  const scanY = scan >= 0 ? y + scan * H * s : -1e9;

  g.setLineDash([]);
  g.lineCap = 'butt';
  for (let i = 0; i < placed.length - 1; i++) {
    const a = placed[i], b = placed[i + 1];
    if (a.m.draw < 1 || b.m.draw < 0) continue;
    const y1 = a.top + a.M.h * s + a.dy, y2 = b.top + b.dy;
    const lit = A.beatCount % (placed.length - 1) === i;
    g.strokeStyle = HEX.white; g.lineWidth = s * .014;
    tLine(g, cx, y1 + s * .015, cx, y2 - s * .015);
    g.fillStyle = lit ? HEX.red : HEX.white;
    tDot(g, cx, (y1 + y2) / 2, s * (lit ? .03 : .016));
  }

  for (const { m, M, top, dy } of placed) {
    if (m.draw <= 0) continue;
    const e = Math.min(1, Math.max(0, m.sp * 2.2));
    const inv = m.inv !== (Math.abs(top + dy + M.h * s / 2 - scanY) < s * .28);
    const full = m.draw >= 1, z = 1 + m.pop * .14 + e * .06;
    const pass = (c, a, ox) => {
      g.save();
      g.translate(cx + ox, top + dy + M.h * s / 2);
      g.scale(s * z * Math.cos(m.flip * Math.PI), s * z);
      g.translate(-.5, -M.h / 2);
      g.lineWidth = TOT_LW; g.lineJoin = 'miter'; g.lineCap = 'butt';
      g.setLineDash(full ? [] : [m.draw * 5, 5]);
      // While a module traces on, its solid fills wait until the outline is mostly drawn.
      TFILL.off = !full && m.draw < .6;
      M.draw(g, { c, a, t, ph, e, look: TOT.look, beat: A.beatCount, full });
      TFILL.off = false;
      g.restore();
    };
    if (full && e > .3) pass(HEX.red, HEX.red, s * e * .05);
    pass(inv ? HEX.red : HEX.white, inv ? HEX.white : HEX.red, 0);
  }

  if (scan >= 0) {
    g.setLineDash([]);
    g.strokeStyle = HEX.red; g.lineWidth = s * .012;
    tLine(g, x - s * .18, scanY, x + s * 1.18, scanY);
    g.lineWidth = s * .03;
    tLine(g, x - s * .18, scanY - s * .04, x - s * .18, scanY + s * .04);
    tLine(g, x + s * 1.18, scanY - s * .04, x + s * 1.18, scanY + s * .04);
  }
}

/* ------------------------------------------------------------------ */
/* Logo fever cuts                                                     */
/* ------------------------------------------------------------------ */

// The logo is three flat colours (black ground, white line-work, red goggles). Split it into those
// regions once, then rebuild it in its two colourways: on black, and on red with black goggles.
const VARIANTS = [['black', 'white', 'red'], ['red', 'white', 'black']];
const logos = [];
const cutCanvas = $('cut'), cutCtx = cutCanvas.getContext('2d');
const F = { cuts: 0, frames: 0, v: 0, z: 1, solid: false, kind: 'logo', totem: null };

(() => {
  const img = new Image();
  img.onload = () => {
    const h = Math.min(1400, img.naturalHeight), w = Math.round(img.naturalWidth * h / img.naturalHeight);
    const src = document.createElement('canvas');
    src.width = w; src.height = h;
    const g = src.getContext('2d');
    g.drawImage(img, 0, 0, w, h);
    const px = g.getImageData(0, 0, w, h).data;
    const cls = new Uint8Array(w * h);
    for (let i = 0; i < cls.length; i++) {
      const r = px[i * 4], gg = px[i * 4 + 1], b = px[i * 4 + 2];
      cls[i] = r > 140 && gg < 110 && b < 110 ? 2 : (r + gg + b) / 3 > 128 ? 1 : 0;
    }
    for (const v of VARIANTS) {
      const rgb = v.map((n) => new THREE.Color(HEX[n]).toArray().map((c) => Math.round(c * 255)));
      const c = document.createElement('canvas');
      c.width = w; c.height = h;
      const cg = c.getContext('2d'), out = cg.createImageData(w, h);
      for (let i = 0; i < cls.length; i++) {
        const k = rgb[cls[i]];
        out.data[i * 4] = k[0]; out.data[i * 4 + 1] = k[1]; out.data[i * 4 + 2] = k[2]; out.data[i * 4 + 3] = 255;
      }
      cg.putImageData(out, 0, 0);
      logos.push({ canvas: c, bg: HEX[v[0]] });
    }
  };
  img.src = '/logo.jpg';
})();

function fever(n) {
  if (!logos.length) { flash = 1; return; }
  F.kind = 'logo';
  F.cuts = Math.max(F.cuts, Math.round(n));
  F.frames = 0;
}

function totemFlash(n) {
  if (F.cuts > 0) return;
  F.kind = 'totem';
  F.cuts = Math.round(n);
  F.frames = 0;
}

function drawCut() {
  const { W, H } = view();
  if (F.kind === 'totem') {
    cutCtx.fillStyle = HEX.black;
    cutCtx.fillRect(0, 0, W, H);
    if (F.solid) return;
    const h = totemH(F.totem), sc = Math.min(W * .42, H * .9 / h) * F.z;
    drawTotem(cutCtx, F.totem, (W - sc) / 2, (H - h * sc) / 2, sc);
    return;
  }
  const L = logos[F.v];
  cutCtx.fillStyle = L.bg;
  cutCtx.fillRect(0, 0, W, H);
  if (F.solid) return;
  const c = L.canvas, k = Math.min(W / c.width, H / c.height) * .86 * F.z;
  cutCtx.drawImage(c, (W - c.width * k) / 2, (H - c.height * k) / 2, c.width * k, c.height * k);
}

// A logo sequence owns the whole screen: it flips between the two colourways and their bare
// background colours, and only hands back to the scene when the burst is over.
function feverUpdate() {
  if (F.frames > 0) { F.frames--; return; }
  if (F.cuts <= 0) { cutCanvas.classList.remove('on'); return; }
  F.cuts--;
  F.v = 1 - F.v;
  F.solid = Math.random() < (F.kind === 'totem' ? .2 : .3);
  if (F.kind === 'totem') F.totem = makeTotem();
  F.z = rand(.88, 1.04);
  F.frames = 1 + (Math.random() * 3 | 0);
  drawCut();
  cutCanvas.classList.add('on');
}

/* ------------------------------------------------------------------ */
/* Sync mode: tap along to record when each line starts                */
/* ------------------------------------------------------------------ */

const SY = { on: false };
const TAP_LATENCY = .12;

function syncTimes() {
  if (!localSync[cur]) localSync[cur] = [];
  return localSync[cur];
}

function syncRender() {
  if (!SY.on) return;
  const lines = SONG_LINES[cur], n = syncTimes().length;
  $('syTrack').textContent = TRACKS[cur].title;
  $('syPos').textContent = `${Math.min(n + 1, lines.length)}/${lines.length}`;
  $('syPrev').textContent = n > 0 ? lines[n - 1] : '';
  $('syNext').textContent = n < lines.length ? lines[n] : 'DONE — COPY TIMINGS AND SEND THEM OVER';
  $('syAfter').textContent = lines[n + 1] || '';
}

function syncToggle() {
  SY.on = !SY.on;
  $('sync').classList.toggle('on', SY.on);
  $('syMsg').textContent = '';
  if (!SY.on) return;
  ensureCtx(); actx.resume();
  if (mode !== 'track') playTrack(cur);
  if (!syncTimes().length) { audio.currentTime = 0; audio.play().catch(() => {}); }
  syncRender();
}

function syncTap() {
  const arr = syncTimes();
  const raw = Math.max(0, audio.currentTime - TAP_LATENCY);
  // Re-tapping after seeking back replaces everything from that point on.
  while (arr.length && arr[arr.length - 1] >= raw) arr.pop();
  const text = SONG_LINES[cur][arr.length];
  if (!text) return;
  let t = raw;
  const grid = TRACK_GRID[cur];
  if (grid) {
    const beat = 60 / grid.bpm;
    let bar = Math.round((raw - grid.phase) / (4 * beat));
    const at = (b) => grid.phase + (b * 4 + grid.pickup(text)) * beat;
    while (arr.length && at(bar) <= arr[arr.length - 1]) bar++;
    t = at(bar);
  }
  arr.push(Math.round(t * 1000) / 1000);
  saveLocalSync();
  syncRender();
}

function syncUndo() {
  const arr = syncTimes();
  arr.pop();
  saveLocalSync();
  audio.currentTime = arr.length ? arr[arr.length - 1] + .05 : 0;
  syncRender();
}

function syncClear() {
  localSync[cur] = [];
  saveLocalSync();
  audio.currentTime = 0;
  syncRender();
}

async function syncCopy() {
  const out = {};
  TRACKS.forEach((tr, i) => { const t = timingsFor(i); if (t && t.length) out[tr.title] = t; });
  const text = 'BURROW_SYNC ' + JSON.stringify(out);
  try { await navigator.clipboard.writeText(text); $('syMsg').textContent = 'COPIED'; }
  catch (e) { window.prompt('Copy these timings:', text); }
}

$('syTap').addEventListener('pointerdown', (e) => { e.preventDefault(); syncTap(); });
$('syUndo').addEventListener('click', syncUndo);
$('syPrevT').addEventListener('click', () => { playTrack(cur - 1); if (!syncTimes().length) audio.currentTime = 0; });
$('syNextT').addEventListener('click', () => { playTrack(cur + 1); if (!syncTimes().length) audio.currentTime = 0; });
$('syBack').addEventListener('click', () => { audio.currentTime = Math.max(0, audio.currentTime - 5); });
$('syFwd').addEventListener('click', () => { audio.currentTime += 5; });
$('syExit').addEventListener('click', syncToggle);
$('syCopy').addEventListener('click', syncCopy);
$('syClear').addEventListener('click', syncClear);

const S = {};

S.FACE = {
  len: 16,
  setup() {
    setCam(35, [0, 0, 6]);
    setBg('black');
    const m = masks[0];
    m.visible = true;
    palette(m, 'black', 'red', 'white', 'red', 'black');
    const { aspect } = view(), h = visH(6);
    this.s = Math.min(.86 * h / 3.4, .8 * h * aspect / MASK.w);
  },
  text: 'block',
  update(t) {
    const m = masks[0];
    m.rotation.set(-A.kick * .3 + Math.sin(t * .3) * .06, Math.sin(t * .45) * .55, Math.sin(t * .23) * .08);
    m.scale.setScalar(this.s * (1 + A.kick * .05));
    m.position.y = -MASK.faceY * this.s;
    m.material.uniforms.uGlitch.value = A.kick > .85 ? .25 : 0;

S.ARMY = {
  len: 16,
  setup() {
    setBg('red');
    const { aspect } = view();
    this.sx = MASK.w * 1.2; this.sy = MASK.h * 1.02;
    this.rows = aspect > 1 ? 2 : 3;
    this.cols = Math.max(2, Math.min(12, Math.round(aspect * this.rows * this.sy / this.sx)));
    const fov = 35, gw = this.cols * this.sx, gh = this.rows * this.sy;
    const tan = Math.tan(THREE.MathUtils.degToRad(fov / 2));
    const d = Math.max(gh / 2 / tan, gw / 2 / (tan * aspect)) * 1.02;
    setCam(fov, [0, 0, d]);

    for (let i = 0; i < this.n; i++) {
      masks[i].visible = true;
      masks[i].scale.setScalar(1);
      palette(masks[i], 'black', 'black', 'white', 'red', 'red');
    }
    this.odd = -1;
  },
  text: 'slam',
  update(t) {
    if (A.beat && A.beatCount % 4 === 0) {

      palette(masks[this.odd], 'white', 'white', 'white', 'black', 'black');
    }

      const m = masks[i], c = i % this.cols, r = Math.floor(i / this.cols);
      const x = t - A.lastBeat - (c + r) * .035;
      const nod = x >= 0 ? Math.exp(-x * 8) * A.strength : 0;
      m.position.set((c - (this.cols - 1) / 2) * this.sx, -(r - (this.rows - 1) / 2) * this.sy + nod * .12, 0);
      m.rotation.set(-nod * .5, Math.sin(t * .7 + m.userData.phase) * .35, Math.sin(t * .5 + m.userData.phase) * .05);

S.TUNNEL = {

S.ORBIT = {

const bandVid = $('band');

// Full-screen band animation, dropped in sparingly between scenes. Plays once, never loops,
// and at most BAND_MAX times per song; the scene ends when the clip does.
const BAND_MAX = 3;
let bandPlays = 0;

S.BAND = {
  len: 16,
  setup() {

const totemCv = $('totem'), totemCtx = totemCv.getContext('2d');

// Five short totem sequences, 8 beats each. They share the beat bookkeeping in totemScene().
function totemScene(def) {
  return Object.assign({
    len: 8,
    text: 'none',
    setup() {
      setCam(35, [0, 0, 6]);
      setBg('black');
      totemCv.classList.add('on');
      this.beats = 0;
      this.init(view());
    },
    update(time, dt) {
      const { W, H } = view();
      totemCtx.clearRect(0, 0, W, H);
      TOT.look += (TOT.lookT - TOT.look) * Math.min(1, dt * 14);
      if (A.beat) {
        this.beats++;
        TOT.lookT = pick([-1, -1, 0, 1, 1]);
        this.onBeat(W, H);
      }
      this.draw(totemCtx, W, H, dt, beatPhase());
    },
  }, def);
}

// Centre totem flanked by a smaller mirrored pair (dropped on narrow screens).
function heroInit(self, aspect) {
  self.hero = makeTotem();
  self.flank = aspect > .8 ? makeTotem() : null;
  self.group = [self.hero, ...(self.flank ? [self.flank] : [])];
}

function heroDraw(self, g, W, H, dt, ph, scan) {
  stepTotems(self.group, dt);
  const bar = ((self.beats % 4) + ph) / 4;
  const h = totemH(self.hero), sc = Math.min(W * .34, H * .88 / h);
  drawTotem(g, self.hero, (W - sc) / 2, (H - h * sc) / 2, sc, { scan: scan ? bar : -1 });
  if (!self.flank) return;
  const fh = totemH(self.flank), fs = Math.min(W * .17, H * .6 / fh);
  for (const side of [-1, 1]) {
    g.save();
    g.translate(W / 2 + side * W * .3, 0);
    g.scale(side, 1);
    drawTotem(g, self.flank, -fs / 2, (H - fh * fs) / 2, fs, { scan: scan ? (bar + .5) % 1 : -1 });
    g.restore();
  }
}

// Draws itself on: one module of each totem per beat.
S.TOTEM_TRACE = totemScene({
  init({ aspect }) {
    heroInit(this, aspect);
    this.group.forEach((tt) => hideTotem(tt));
  },
  onBeat() {
    for (const [tt, order] of [[this.hero, 1], [this.flank, -1]]) {
      if (!tt) continue;
      const next = (order > 0 ? tt : [...tt].reverse()).find((m) => m.draw < 0);
      if (next) { next.go = true; next.draw = 0; next.pop = 1; }
    }
    kickTotem(this.hero, A.strength * .6);
  },
  draw(g, W, H, dt, ph) { heroDraw(this, g, W, H, dt, ph, this.hero.every((m) => m.draw >= 1)); },
});

// Fully built and kicking: springs, swaps, red echoes and the scan line.
S.TOTEM_ALIVE = totemScene({
  init({ aspect }) {
    heroInit(this, aspect);
    this.group.forEach((tt, i) => hideTotem(tt, i * .1));
  },
  onBeat() {
    this.group.forEach((tt, i) => kickTotem(tt, A.strength, i * .06));
    hitTotem(this.beats % 2 && this.flank ? this.flank : this.hero);
  },
  draw(g, W, H, dt, ph) { heroDraw(this, g, W, H, dt, ph, true); },
});

// Columns of totems that step up/down one notch per beat.
S.TOTEM_COLUMNS = totemScene({
  init({ aspect }) {
    this.n = aspect > 1.3 ? 5 : aspect > .8 ? 4 : 3;
    this.cols = Array.from({ length: this.n }, (_, i) => {
      const totems = [makeTotem(), makeTotem(), makeTotem()];
      totems.forEach((tt, j) => hideTotem(tt, Math.abs(i - (this.n - 1) / 2) * .2 + j * .12));
      const off = rand(0, 1500);
      return { totems, off, target: off, dir: i % 2 ? 1 : -1 };
    });
  },
  onBeat(W) {
    const sc = W / this.n * .6;
    for (const c of this.cols) {
      c.target += c.dir * sc * (A.strength > .85 ? 1.1 : .55);
      c.totems.forEach((tt, j) => kickTotem(tt, A.strength, j * .02));
      if (Math.random() < .5) hitTotem(pick(c.totems));
    }
  },
  draw(g, W, H, dt, ph) {
    const cw = W / this.n, sc = cw * .6, bar = ((this.beats % 4) + ph) / 4;
    this.cols.forEach((c, i) => {
      stepTotems(c.totems, dt);
      c.off += (c.target - c.off) * Math.min(1, dt * 16);
      const total = c.totems.reduce((a, tt) => a + (totemH(tt) + TOT_SPACER) * sc, 0);
      let y = ((c.off % total) + total) % total - total;
      const x = cw * i + (cw - sc) / 2;
      while (y < H) {
        c.totems.forEach((tt, j) => {
          drawTotem(g, tt, x, y, sc, { scan: (bar + i * .25 + j * .33) % 1 });
          y += (totemH(tt) + TOT_SPACER) * sc;
        });
      }
    });
  },
});

// One huge totem; the view drops one module per beat and snaps there.
S.TOTEM_DIVE = totemScene({
  init({ W, H }) {
    this.tt = makeTotem();
    hideTotem(this.tt, 0);
    this.sc = Math.min(W * .9, H * 1.1);
    this.focus = 0;
    this.y = this.focusY();
  },
  focusY() {
    let y = 0;
    for (let i = 0; i < this.focus; i++) y += MODS[this.tt[i].k].h + TOT_GAP;
    return (y + MODS[this.tt[this.focus].k].h / 2) * this.sc;
  },
  onBeat() {
    this.focus = (this.focus + 1) % this.tt.length;
    kickTotem(this.tt, A.strength);
    const m = this.tt[this.focus];
    if (Math.random() < .5) m.flip = 1; else m.inv = !m.inv;
  },
  draw(g, W, H, dt, ph) {
    stepTotems([this.tt], dt);
    this.y += (this.focusY() - this.y) * Math.min(1, dt * 12);
    const z = 1 + A.kick * .04;
    g.save();
    g.translate(W / 2, H / 2); g.scale(z, z); g.translate(-W / 2, -H / 2);
    drawTotem(g, this.tt, (W - this.sc) / 2, H / 2 - this.y, this.sc, { scan: ph });
    g.restore();
  },
});


/* ------------------------------------------------------------------ */
/* Running rabbit: the hand-drawn cycle in three graphic treatments    */
/* ------------------------------------------------------------------ */

const PHI = (1 + Math.sqrt(5)) / 2;
const RUN_COLS = [HEX.red, HEX.black, HEX.white];
// Four frames per beat: one stride every two beats, close to the drawing's own 10fps.
const runFrame = (offset = 0) => (((Math.floor(MC.v * 4) + offset) % 8) + 8) % 8;

// Russian dolls: each rabbit holds a smaller one (x 1/phi) running a couple of frames behind,
// and the view zooms in one doll per bar, forever.
S.RUN_DOLL = totemScene({
  init() { this.punch = 0; },
  onBeat() { this.punch = 1; },
  draw(g, W, H, dt, ph) {
    this.punch *= Math.exp(-dt * 8);
    const beats = MC.v, gen = Math.floor(beats / 4), u = (beats / 4) % 1;
    const big = Math.max(W / RUN_W, H) * 1.7 * (1 + this.punch * .03);
    g.fillStyle = RUN_COLS[(gen + 2) % 3];
    g.fillRect(0, 0, W, H);
    for (let k = 0; ; k++) {
      const h = big * PHI ** (u - k);
      if (h < 5) break;
      const fill = RUN_COLS[(k + gen) % 3], line = RUN_COLS[(k + gen + 1) % 3];
      drawRun(g, runFrame(-2 * k), W / 2, H / 2 + h * .06, h, line, fill, (k + gen) % 2 === 1);
    }
  },
});

// Golden mean: the golden-rectangle construction, a rabbit in every square running its arc of
// the spiral. The view zooms into the eye by phi and turns 90 degrees per bar, which is seamless
// because each square is the last one shrunk by 1/phi and turned a quarter.
S.RUN_GOLDEN = totemScene({
  init({ W, H }) {
    const h0 = Math.min(H, W / PHI), w0 = h0 * PHI;
    const build = (x, y, w, hh, i0, n) => {
      const sq = [];
      for (let i = i0; i < i0 + n; i++) {
        const side = (i & 1) ? w : hh, q = ((i % 4) + 4) % 4;
        if (q === 0) { sq.push({ x, y, s: side, cx: x + side, cy: y + side, a0: Math.PI, i }); x += side; w -= side; }
        else if (q === 1) { sq.push({ x, y, s: side, cx: x, cy: y + side, a0: Math.PI * 1.5, i }); y += side; hh -= side; }
        else if (q === 2) { sq.push({ x: x + w - side, y, s: side, cx: x + w - side, cy: y, a0: 0, i }); w -= side; }
        else { sq.push({ x, y: y + hh - side, s: side, cx: x + w, cy: y + hh - side, a0: Math.PI / 2, i }); hh -= side; }
      }
      return { sq, eye: { x: x + w / 2, y: y + hh / 2 } };
    };
    const x0 = (W - w0) / 2, y0 = (H - h0) / 2;
    this.eye = build(x0, y0, w0, h0, 0, 40).eye;
    // Start four squares further out (phi^4 larger about the same eye) so the pattern runs off
    // every edge of the screen and the bar-to-bar wrap is seamless.
    const k = PHI ** 4;
    this.sq = build(this.eye.x + (x0 - this.eye.x) * k, this.eye.y + (y0 - this.eye.y) * k, w0 * k, h0 * k, -4, 30).sq;
  },
  onBeat() {},
  draw(g, W, H, dt, ph) {
    const beats = MC.v, gen = Math.floor(beats / 4), u = (beats / 4) % 1;
    g.fillStyle = RUN_COLS[(gen + 2) % 3];
    g.fillRect(0, 0, W, H);
    g.save();
    g.translate(this.eye.x, this.eye.y);
    g.rotate(-u * Math.PI / 2);
    g.scale(PHI ** u, PHI ** u);
    g.translate(-this.eye.x, -this.eye.y);
    const lw = Math.max(1, Math.min(W, H) * .003) / PHI ** u;
    for (const q of this.sq) {
      if (q.s < 2) break;
      const col = RUN_COLS[(q.i + gen + 12) % 3], ink = RUN_COLS[(q.i + gen + 13) % 3];
      g.fillStyle = col;
      g.fillRect(q.x, q.y, q.s, q.s);
      g.strokeStyle = ink; g.lineWidth = lw;
      g.beginPath(); g.arc(q.cx, q.cy, q.s, q.a0, q.a0 + Math.PI / 2); g.stroke();
      // The rabbit runs along its quarter-arc of the spiral, nose following the curve.
      const p = ((beats / 2 + q.i * .25) % 1);
      const a = q.a0 + p * Math.PI / 2, r = q.s * .7;
      g.save();
      g.translate(q.cx + Math.cos(a) * r, q.cy + Math.sin(a) * r);
      g.rotate(a + Math.PI / 2);
      drawRun(g, runFrame(q.i + 8), 0, 0, q.s * .44, ink);
      g.restore();
    }
    g.restore();
  },
});

// Repetition and scale: bands each 1/phi the height of the one below, packed with rabbits that
// travel one stride per cycle (so their feet stay planted), rows alternating direction.
S.RUN_HERD = totemScene({
  init({ H }) {
    this.rows = [];
    let y = H;
    for (let k = 0; y > 0; k++) {
      const h = H * .4 * (1 / PHI) ** k;
      y -= h;
      this.rows.push({ y, h: Math.max(h, 3), off: rand(0, 1000), dir: k % 2 ? -1 : 1, k });
      if (h < 3) { this.rows[this.rows.length - 1].y = 0; this.rows[this.rows.length - 1].h = y + h; break; }
    }
    this.flash = -1;
  },
  onBeat() { this.flash = Math.floor(Math.random() * this.rows.length); },
  draw(g, W, H, dt, ph) {
    const ibi = A.bpm ? 60 / A.bpm : .5;
    for (const r of this.rows) {
      const inv = r.k === this.flash && ph < .5;
      const bg = RUN_COLS[(r.k + (inv ? 1 : 0)) % 3], ink = RUN_COLS[(r.k + (inv ? 2 : 1)) % 3];
      g.fillStyle = bg;
      g.fillRect(0, r.y, W, r.h + 1);
      const rh = r.h * .82, gap = RUN_W * rh * 1.08;
      r.off += r.dir * gap / (2 * ibi) * dt;
      const start = ((r.off % gap) + gap) % gap - gap;
      let n = 0;
      for (let x = start; x < W + gap; x += gap, n++) {
        drawRun(g, runFrame((n * 3 + r.k) % 8), x, r.y + r.h / 2, rh, ink, null, r.dir < 0);
      }
    }
  },
});

const MASK_SCENES = ['FACE', 'ARMY', 'TUNNEL', 'ORBIT', 'STROBE'];
const TOTEM_SCENES = ['TOTEM_TRACE', 'TOTEM_ALIVE', 'TOTEM_COLUMNS', 'TOTEM_DIVE'];
const RUN_SCENES = ['RUN_DOLL', 'RUN_GOLDEN', 'RUN_HERD'];
const ROTATION = [...MASK_SCENES, ...TOTEM_SCENES, ...RUN_SCENES];
// Number keys: 1-5 mask scenes, 6 band clip, 7 steps through the totem sequences, 8 the runs.
const KEYS = [...MASK_SCENES, 'BAND', 'TOTEM', 'RUN'];
// Scenes drawn on the flat 2D canvas rather than in 3D.
const isFlat = (n) => n.startsWith('TOTEM_') || n.startsWith('RUN_');

function nextScene() {
  let n;
  sceneCuts++;
  if (sceneCuts % 3 === 0 && sceneName !== 'BAND' && bandPlays < BAND_MAX) n = 'BAND';
  else do { n = pick(ROTATION); } while (n === sceneName);
  setScene(n);
}
bandVid.addEventListener('ended', () => { if (sceneName === 'BAND') nextScene(); });
let sceneName = 'FACE', sceneBeat = 0, flash = 0, sceneCuts = 0;

function setScene(name, keepText = false) {
  sceneName = name;
  sceneBeat = A.beatCount;
  if (name !== 'BAND') { bandVid.classList.remove('on'); bandVid.pause(); }
  if (!isFlat(name)) totemCv.classList.remove('on');
  resetMasks();
  if (!keepText) textSetup(S[name].text);
  S[name].setup();
  if (keepText) renderText();
  if (!keepText) fever(rand(6, 10));
  $('scn').textContent = `SCENE · ${name.replace('_', ' ')}`;
}

/* ------------------------------------------------------------------ */
/* HUD, input, grain                                                   */
/* ------------------------------------------------------------------ */

function updateHud() {
  const playing = mode === 'track' && !audio.paused;
  $('play').textContent = playing ? '❚❚' : '▶';
  $('trk').textContent = mode === 'mic' ? 'LIVE INPUT' : TRACKS[cur].title;
  $('src').textContent = mode === 'mic' ? 'MIC' : playing ? 'PLAYING' : mode === 'track' ? 'PAUSED' : 'IDLE';
}

function enter(useMic) {
  $('gate').classList.add('gone');
  ensureCtx();
  actx.resume();
  if (useMic) startMic(); else playTrack(cur);
}

$('gate').addEventListener('click', () => enter(false));
$('play').addEventListener('click', () => { ensureCtx(); actx.resume(); togglePlay(); });
$('prev').addEventListener('click', () => { ensureCtx(); actx.resume(); playTrack(cur - 1); });
$('next').addEventListener('click', () => { ensureCtx(); actx.resume(); playTrack(cur + 1); });
$('bar').addEventListener('click', (e) => {
  if (!audio.duration) return;
  const r = e.currentTarget.getBoundingClientRect();
  audio.currentTime = ((e.clientX - r.left) / r.width) * audio.duration;
});

window.addEventListener('keydown', (e) => {
  const gateOpen = !$('gate').classList.contains('gone');
  if (SY.on && !e.repeat) {
    if (e.key === 'Enter') { e.preventDefault(); return syncTap(); }
    if (e.key === 'Backspace') { e.preventDefault(); return syncUndo(); }
    if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') {
      audio.currentTime = Math.max(0, audio.currentTime + (e.key === 'ArrowLeft' ? -5 : 5));
      return;
    }
  }
  if ((e.key === 'y' || e.key === 'Y') && !gateOpen) return syncToggle();
  if (e.code === 'Space') { e.preventDefault(); if (gateOpen) enter(false); else togglePlay(); }
  else if (e.key === 'ArrowRight') { ensureCtx(); actx.resume(); playTrack(cur + 1); }
  else if (e.key === 'ArrowLeft') { ensureCtx(); actx.resume(); playTrack(cur - 1); }
  else if (e.key >= '1' && e.key <= String(KEYS.length)) {
    const k = KEYS[+e.key - 1];
    const cycle = (list) => list[(list.indexOf(sceneName) + 1) % list.length];
    setScene(k === 'TOTEM' ? cycle(TOTEM_SCENES) : k === 'RUN' ? cycle(RUN_SCENES) : k);
  }
  else if (e.key === 'm' || e.key === 'M') { if (gateOpen) enter(true); else if (mode === 'mic') stopMic(); else startMic(); }
  else if (e.key === 'f' || e.key === 'F') {
    if (document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen?.();
  } else if (e.key === 'h' || e.key === 'H') document.body.classList.toggle('nohud');
});

let idleTimer = 0;
const wake = () => { document.body.classList.remove('idle'); idleTimer = 2.5; };
['mousemove', 'touchstart', 'keydown'].forEach((ev) => window.addEventListener(ev, wake, { passive: true }));

const mouse = { x: 0, y: 0 };
window.addEventListener('mousemove', (e) => {
  mouse.x = e.clientX / window.innerWidth * 2 - 1;
  mouse.y = e.clientY / window.innerHeight * 2 - 1;
});

(() => {
  const c = document.createElement('canvas');
  c.width = c.height = 160;
  const g = c.getContext('2d'), img = g.createImageData(160, 160);
  for (let i = 0; i < img.data.length; i += 4) {
    const v = Math.random() * 255;
    img.data[i] = img.data[i + 1] = img.data[i + 2] = v; img.data[i + 3] = 255;
  }
  g.putImageData(img, 0, 0);
  grain.style.backgroundImage = `url(${c.toDataURL()})`;
})();

function resize() {
  const { W, H } = view();
  renderer.setSize(W, H, false);
  const dpr = Math.min(window.devicePixelRatio, 2);
  cutCanvas.width = W * dpr; cutCanvas.height = H * dpr;
  cutCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
  totemCv.width = W * dpr; totemCv.height = H * dpr;
  totemCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
  camera.aspect = W / H;
  camera.updateProjectionMatrix();
  setScene(sceneName, true);
}
window.addEventListener('resize', resize);

/* ------------------------------------------------------------------ */
/* Main loop                                                           */
/* ------------------------------------------------------------------ */

const clock = new THREE.Clock();
const hudCache = {};
let t = 0;

function frame() {
  requestAnimationFrame(frame);
  const dt = Math.min(clock.getDelta(), .05);
  t += dt;
  analyse(t, dt);
  stepMusicClock(dt);
  syncText();

  if (A.beat) {
    if (A.beatCount - sceneBeat >= S[sceneName].len) {
      nextScene();
    } else {
      textBeat();
      if (A.beatCount % 32 === 0) fever(rand(10, 16));
      else if (!isFlat(sceneName) && A.strength > .75 && Math.random() < .1) totemFlash(rand(2, 4));
      else if (A.strength > .9 && Math.random() < .25) fever(rand(2, 5));
    }
  }
  feverUpdate();

  S[sceneName].update(t, dt);
  textUpdate(dt);

  const lx = Math.sin(t * .3) * .6, lz = .6 + Math.cos(t * .3) * .3;
  for (const m of masks) {
    if (!m.visible) continue;
    const u = m.material.uniforms;
    u.uTime.value = t;
    u.uLight.value.set(lx, .7, lz);
    u.cVoid.value.set(HEX[bgName]);
  }

  camera.position.set(camBase.pos.x + mouse.x * .35, camBase.pos.y - mouse.y * .25, camBase.pos.z);
  camera.lookAt(camBase.look);
  renderer.render(scene, camera);

  flash *= Math.exp(-dt * 9);
  // Only touch the DOM when something actually changes, and move the grain with a
  // compositor-only transform at ~30fps, so the page never repaints full-screen layers per frame.
  const fo = flash > .003 ? flash.toFixed(2) : '0';
  if (fo !== hudCache.flash) { hudCache.flash = fo; flashEl.style.opacity = fo; }
  if ((hudCache.grainTick = !hudCache.grainTick)) {
    grain.style.transform = `translate(${(Math.random() * 160) | 0}px, ${(Math.random() * 160) | 0}px)`;
  }

  if (mode === 'track' && audio.duration) {
    const pct = (audio.currentTime / audio.duration * 100).toFixed(1) + '%';
    if (pct !== hudCache.pct) { hudCache.pct = pct; $('bar').firstElementChild.style.width = pct; }
  }
  const bpm = A.bpm && mode !== 'idle' ? `BPM ~${A.bpm}` : 'BPM —';
  if (bpm !== hudCache.bpm) { hudCache.bpm = bpm; $('bpm').textContent = bpm; }

  if (idleTimer > 0) {
    idleTimer -= dt;
    if (idleTimer <= 0 && $('gate').classList.contains('gone')) document.body.classList.add('idle');
  }
}

updateHud();
const start = () => { resize(); setScene('FACE'); frame(); };
(document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve()).then(start);
})();
</script>
</body>
</html>
